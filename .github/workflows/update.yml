name: Update schedule

# Розкладу тут немає навмисно: запуск приходить ззовні (cron-job.org)
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Примусово перевірити сайт ДТЕК (ігнорувати правила за часом)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - scraper.py
      - .github/workflows/**

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install cloudscraper requests

      - name: Run scraper
        env:
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: python scraper.py

      - name: Commit only if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Змін немає, коміту не буде"
          else
            git commit -m "Оновлення графіка"
            git push
          fi
